<div class="card" style="width: 18rem;">
    <div class="card-body">
        <h5 class="card-title">{{currentUser.id}}</h5>
        <h6 class="card-subtitle mb-2 text-body-secondary">{{currentUser.name}}</h6>
        <p>{{currentUser.isActive}}</p>
        <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's
            content.</p>
        <button class="btn btn-primary" (click)="updateActiveStatus()">Update Active Status</button>
    </div>
</div>
