@switch (ticketPrice) {
    @case (30) {
        <p>Allowed to Play Gaint Wheel</p>
    }
    @case (50) {
        <p>Allowed to Play Gaint Wheel, Dashing Car</p>
    }
    @case (100) {
        <p>Allowed to Play Gaint Wheel, Dashing Car, Roller Coaster</p>
    }
    @default {
        <p>Please purchase the ticket...</p>
    }
}
